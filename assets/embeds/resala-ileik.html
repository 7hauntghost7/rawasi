:root{--night:#101329;--cream:#f1e5cc;--gold:#d9b77c;--muted:#b9b5cb;--ink:#29283a;--lav:#a99bd2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:#f7f0e8;font-family:'Tahoma','Arial',sans-serif}body{overflow-x:hidden;min-height:100vh}.sky{position:fixed;inset:0;overflow:hidden;z-index:-2;background:radial-gradient(ellipse at 22% 22%,#39305d 0,transparent 42%),radial-gradient(ellipse at 78% 72%,#26345a 0,transparent 40%),linear-gradient(145deg,#101329,#17172f 52%,#101a30)}.nebula{position:absolute;border-radius:50%;filter:blur(55px);opacity:.22;animation:drift 24s ease-in-out infinite alternate}.n1{width:55vw;height:40vw;background:#8a6bc1;top:5%;left:-12%}.n2{width:50vw;height:35vw;background:#4c8b9c;right:-12%;bottom:4%;animation-delay:-8s}.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 20%,#fff 99%,transparent),radial-gradient(1px 1px at 72% 13%,#fff 99%,transparent),radial-gradient(2px 2px at 46% 68%,#f5dca8 99%,transparent),radial-gradient(1px 1px at 88% 52%,#fff 99%,transparent),radial-gradient(1px 1px at 29% 83%,#fff 99%,transparent),radial-gradient(1px 1px at 61% 37%,#fff 99%,transparent);background-size:370px 310px;opacity:.45}.horizon{position:absolute;bottom:-30vh;left:-10%;width:120%;height:50vh;background:radial-gradient(ellipse,#8b77a5 0,transparent 65%);filter:blur(50px);opacity:.14}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px);position:relative;z-index:5}.brand{display:flex;gap:10px;align-items:center;color:#f5e9d5;text-decoration:none;font-family:'Traditional Arabic','Amiri',serif;font-size:23px}.brand-mark{color:var(--gold);font-size:24px}.top-actions{display:flex;gap:9px}.icon-btn,.close-btn{border:1px solid #ffffff27;background:#ffffff0c;color:#f4eadb;border-radius:999px;padding:9px 13px;cursor:pointer;font:inherit;backdrop-filter:blur(12px)}.intro{min-height:calc(100svh - 112px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px 80px;position:relative}.intro-glow{position:absolute;width:min(80vw,650px);height:300px;background:#b69bd8;filter:blur(110px);opacity:.13;pointer-events:none}.eyebrow{color:#d8c5a0;font-size:12px;letter-spacing:.08em;margin:0 0 16px}.intro h1{font-family:'Traditional Arabic','Amiri',serif;font-weight:400;font-size:clamp(56px,12vw,112px);line-height:1.15;margin:0;color:#f4e8d4;text-shadow:0 4px 45px #e4c99a35}.intro-line{font-family:'Traditional Arabic','Amiri',serif;font-size:clamp(19px,3vw,27px);color:#d4cde0;margin:14px 0 36px;max-width:650px}.primary-btn{display:flex;align-items:center;gap:22px;border:1px solid #e4c88c80;border-radius:40px;padding:14px 23px;background:linear-gradient(110deg,#d5b47b,#a88dc2);color:#211d34;font:600 15px inherit;cursor:pointer;box-shadow:0 12px 40px #c4a6d52b;transition:.25s}.primary-btn:hover{transform:translateY(-3px);box-shadow:0 16px 50px #c4a6d550}.intro-foot{color:#aaa5bd;font-size:12px;margin-top:30px}.world{padding:22px clamp(16px,4vw,58px) 80px;max-width:1500px;margin:auto;min-height:calc(100svh - 100px)}.hidden{display:none!important}.world-heading{display:flex;align-items:end;justify-content:space-between;gap:20px}.world-heading h2{font:400 clamp(27px,5vw,43px) Amiri,serif;margin:0;color:#f0e6d7}.world-heading .eyebrow{margin-bottom:5px}.whisper-btn{background:transparent;border:0;color:#e6c98d;font:inherit;font-size:13px;cursor:pointer;padding:10px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:22px 0 10px;flex-wrap:wrap}.filters{display:flex;gap:7px;overflow:auto;max-width:100%;padding:3px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #ffffff24;background:#ffffff0b;color:#c9c4d4;border-radius:30px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer}.filter.active{background:#e0c18a;color:#282239;border-color:#e0c18a}.hint,.bottom-note{color:#aaa6ba;font-size:11px}.paper-field{position:relative;min-height:320px;border:1px solid #ffffff10;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#ffffff08,transparent 68%);touch-action:pan-y}.paper{position:absolute;width:clamp(116px,17vw,190px);min-height:112px;padding:17px 13px 14px;border:1px solid #c7ae83;background:linear-gradient(145deg,#f4e8d1,#d9c7a8);color:#423b3a;box-shadow:0 15px 35px #05071366;cursor:grab;user-select:none;touch-action:none;display:flex;flex-direction:column;justify-content:space-between;transition:box-shadow .2s,filter .2s}.paper:before{content:"";position:absolute;inset:5px;border:1px solid #a58d6b55;pointer-events:none}.paper:after{content:"✧";position:absolute;bottom:7px;left:10px;color:#9c825c;font-size:13px}.paper:nth-child(3n){background:linear-gradient(145deg,#e7e0d8,#c9c4c0);transform:rotate(-7deg)}.paper:nth-child(3n+1){transform:rotate(5deg)}.paper:nth-child(4n){background:linear-gradient(145deg,#f4e4c5,#d6bd91)}.paper:hover{z-index:20!important;box-shadow:0 22px 48px #03040b99;filter:brightness(1.06)}.paper.dragging{cursor:grabbing;z-index:50!important;transition:none}.paper .paper-type{font-size:9px;color:#88775e;margin-bottom:8px}.paper .paper-title{font:700 clamp(14px,1.8vw,18px)/1.55 Amiri,serif}.paper .paper-read{font-size:9px;color:#9a896f;margin-top:10px}.paper.read{filter:saturate(.65);opacity:.82}.paper.read:before{border-style:dashed}.bottom-note{text-align:center;margin-top:13px}.reader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px}.reader-backdrop{position:absolute;inset:0;background:#080a18d9;backdrop-filter:blur(12px);animation:fade .25s}.letter{position:relative;width:min(680px,100%);max-height:88svh;overflow:auto;background:radial-gradient(circle at 90% 5%,#fff8e8,#f0e4ce 65%,#e4d2b5);color:#332e32;padding:clamp(28px,6vw,58px);box-shadow:0 30px 100px #0009;border:1px solid #e9d8b9;animation:letterIn .45s cubic-bezier(.2,.8,.2,1)}.letter:before{content:"";position:absolute;inset:10px;border:1px solid #a58a654c;pointer-events:none}.letter .close-btn{position:absolute;top:16px;left:16px;color:#665844;border-color:#88775b55;background:#fff5}.letter-stamp{text-align:center;color:#a88d5c;font-size:26px}.letter-category{text-align:center;color:#9a815c;font-size:11px;margin:8px 0}.letter h2{font:700 clamp(26px,5vw,38px)/1.5 Amiri,serif;text-align:center;margin:8px 0 24px;color:#40343a}.letter-body{font:400 clamp(17px,2.3vw,20px)/2.05 Amiri,serif;white-space:pre-line;min-height:120px;color:#403a3b}.letter-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:28px}.paper-action{border:1px solid #b5a17f;background:#fff8ed;color:#65553f;border-radius:30px;padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}.paper-action.active{background:#e8d5b4}.letter-sign{text-align:left;color:#8b7657;font:italic 17px Amiri,serif;margin-top:25px}.side-panel{position:fixed;z-index:30;top:0;bottom:0;right:0;width:min(390px,92vw);background:#17182d;border-left:1px solid #ffffff22;padding:24px;box-shadow:-20px 0 60px #0005;overflow:auto;animation:slideIn .25s}.panel-head{display:flex;align-items:center;justify-content:space-between}.panel-head h3{font:400 25px Amiri,serif}.saved-item{padding:14px 4px;border-bottom:1px solid #ffffff19;cursor:pointer}.saved-item strong{font:700 17px Amiri,serif}.saved-item small{display:block;color:#aaa5bb;margin-top:4px}.toast{position:fixed;z-index:40;bottom:24px;left:50%;transform:translate(-50%,20px);background:#f1e5cc;color:#302a38;padding:10px 18px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}footer{display:flex;justify-content:space-between;padding:18px clamp(18px,5vw,70px);font-size:11px;color:#9995ad;border-top:1px solid #ffffff12}@media(pointer:coarse){.paper{touch-action:manipulation;cursor:pointer}.paper-field{touch-action:auto}}@keyframes drift{to{transform:translate(8vw,5vh) scale(1.15)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes letterIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}@keyframes slideIn{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}@media(max-width:600px){.topbar{height:62px;padding:0 15px}.brand{font-size:20px}.icon-btn{padding:8px 10px;font-size:12px}.intro{min-height:calc(100svh - 90px)}.world{padding:18px 12px 65px}.world-heading{align-items:start;flex-direction:column;gap:8px}.toolbar{margin:12px 0}.hint{width:100%}.paper-field{min-height:320px;border-radius:20px}.paper{width:clamp(105px,31vw,145px);min-height:104px;padding:14px 10px}.paper .paper-title{font-size:14px}.letter{padding:34px 25px;max-height:91svh}.letter-actions{gap:6px}.paper-action{font-size:11px;padding:8px 10px}footer{padding:15px}}

<body>

<main>
<section id="intro" class="intro"><div class="intro-glow"></div><p class="eyebrow" data-i18n="eyebrow">مساحة صغيرة، ورسائل كثيرة</p><h1 data-i18n="brand">رسالة إليك</h1><p class="intro-line" data-i18n="welcome">في مكان ما بين هذه الأوراق، هناك رسالة كُتبت لك.</p><button id="enterBtn" class="primary-btn"><span data-i18n="enter">ادخل إلى عالم الرسائل</span><span>←</span></button><div class="intro-foot" data-i18n="introFoot">خذ وقتك. لا توجد طريقة صحيحة للبحث.</div></section>
<section id="world" class="world hidden" aria-label="رسائل مبعثرة"><div class="world-heading"><div><p class="eyebrow" data-i18n="worldEyebrow">اتبع فضولك</p><h2 data-i18n="worldTitle">رسائل تنتظر أن تجدها</h2></div><button id="randomBtn" class="whisper-btn" data-i18n="random">ربما هذه رسالتك ✦</button></div><div class="toolbar"><div class="filters" id="filters"></div><span class="hint" data-i18n="hint">المس أي ورقة لتكتشفها</span></div><div id="paperField" class="paper-field"></div><div class="bottom-note" data-i18n="bottomNote">بعض الرسائل لا تظهر إلا عندما تقترب منها.</div></section>

<script>
let messages = [
{id:'m01',cat:'faith',title:'حين تشتاق إلى الله',body:'ربما لا تحتاج الآن إلى إجابة طويلة، بل إلى أن تعود بقلبك كما هو؛ متعباً، مرتبكاً، ومحمّلاً بما لا تستطيع قوله لأحد.\n\nلا تجعل شعورك بالتقصير يمنعك من الرجوع. باب الله ليس جائزةً للذين لم يخطئوا، بل رحمةٌ لمن عرفوا حاجتهم إليه. ابدأ بخطوة صغيرة وصادقة: صلاة في وقتها، دعاء من قلبك، أو آية تتأملها دون استعجال.\n\nلا تقِس قربك من الله بمزاج يوم واحد. عُد كلما ابتعدت.' ,enTitle:'When your heart misses God',enBody:'Perhaps you do not need a long answer right now. Perhaps you only need to return as you are: tired, uncertain, carrying things you cannot explain.\n\nDo not let the feeling of falling short keep you away. Begin with one small, honest step: a prayer, a quiet supplication, or a verse you sit with. Return whenever you drift.'},
{id:'m02',cat:'healing',title:'حين تتعب روحك',body:'لا بأس أن تتوقف قليلاً. أنت لست آلة مطالبة بالإنتاج كل يوم، ولا ينبغي أن تثبت قيمتك بقدرتك على الاحتمال إلى ما لا نهاية.\n\nخفف ما تستطيع تخفيفه. نم، اشرب ماءً، تحدث مع شخص تأمن إليه، واترك بعض الأمور لوقت آخر. ليس كل تأجيل هزيمة، وليس كل صمت قوة.\n\nامنح نفسك المعاملة التي تمنحها لشخص تحبه حين تراه منهكاً.',enTitle:'When your soul feels tired',enBody:'It is okay to pause. You are not a machine expected to produce every day, and your worth is not measured by how much you can endure.\n\nLighten what you can. Rest, drink water, speak to someone you trust, and leave some things for another day. Treat yourself with the kindness you would offer someone you love.'},
{id:'m03',cat:'life',title:'إلى من لا يعرف من أين يبدأ',body:'لا تبحث عن بداية مثالية. البدايات الحقيقية غالباً صغيرة، مرتبكة، ولا يصفق لها أحد.\n\nاختر شيئاً واحداً يمكنك فعله اليوم، واجعله واضحاً وصغيراً إلى درجة يصعب معها الهروب منه. صفحة واحدة، مكالمة واحدة، عشر دقائق من المحاولة.\n\nالطريق لا يكشف نفسه كله لمن يقف عند أوله. تحرك، وسترى الخطوة التالية.',enTitle:'To the one who does not know where to begin',enBody:'Do not wait for a perfect beginning. Real beginnings are often small, uncertain, and unnoticed. Choose one thing you can do today and make it small enough to start. The whole road rarely appears to someone standing at its beginning. Move, and the next step will become clearer.'},
{id:'m04',cat:'relationships',title:'إلى من خذله شخص وثق به',body:'ما حدث قد يغيّر طريقة ثقتك، لكنه لا يجب أن يسرق قدرتك على المحبة.\n\nلا تلُم نفسك لأنك كنت صادقاً. الصدق ليس خطأً، والثقة ليست عيباً. تعلّم من التجربة، وضع حدوداً أوضح، لكن لا تسمح لتصرف شخص واحد أن يعرّف لك العالم كله.\n\nيمكنك أن تسامح دون أن تعود، وأن تتمنى الخير دون أن تفتح الباب ذاته مرة أخرى.',enTitle:'To the one let down by someone they trusted',enBody:'What happened may change how you trust, but it does not have to take away your ability to love. Do not blame yourself for being sincere. Learn, set clearer boundaries, and remember: you can forgive without returning, and wish someone well without reopening the same door.'},
{id:'m05',cat:'ambition',title:'إلى من يخاف أن يبدأ',body:'الخوف لا يعني أنك غير مستعد دائماً؛ أحياناً يعني فقط أن الأمر مهم بالنسبة إليك.\n\nابدأ وأنت خائف، لكن ابدأ بوعي. لا تحتاج إلى أن تعرف كل شيء، بل أن تعرف ما يكفي للخطوة الأولى، وأن تكون مستعداً للتعلم بعدها.\n\nلا تجعل احتمال الفشل يمنعك من فرصة أن تصبح أفضل.',enTitle:'To the one afraid to begin',enBody:'Fear does not always mean you are unprepared. Sometimes it means the thing matters to you. Begin carefully, even if you are afraid. You do not need to know everything—only enough for the first step, and the willingness to learn after it.'},
{id:'m06',cat:'study',title:'حين تشعر أنك متأخر',body:'أنت ترى جدولك كاملاً، وترى من حولك في لحظات نجاحهم، ثم تقارن ذلك بتعبك الذي لا يراه أحد. هذه مقارنة غير عادلة.\n\nلكل إنسان ظروفه وسرعته وطريقه. راجع ما تستطيع تحسينه، لا ما فاتك فقط. ضع خطة واقعية، وابدأ من موقعك الحالي لا من المكان الذي تتمنى لو كنت فيه.\n\nالتأخر عن جدول متخيّل لا يعني أنك تأخرت عن حياتك.',enTitle:'When you feel behind',enBody:'You see your whole schedule and other people at their moments of success, then compare them with a struggle no one sees. That is not a fair comparison. Make a realistic plan and begin where you are, not where you wish you had been. Being behind an imagined timeline does not mean you are behind in life.'},
{id:'m07',cat:'failure',title:'بعد أن تخسر شيئاً مهماً',body:'الخسارة موجعة لأنها لا تأخذ الشيء وحده؛ أحياناً تأخذ معه الصورة التي رسمتها للمستقبل. لا تستعجل مطالبة نفسك بأن تكون بخير.\n\nاسمح للحزن أن يأخذ مساحته، ثم افصل بين ما خسرته وبين قيمتك. قد تحتاج إلى وقت لتفهم ما حدث، وما الذي يمكنك إصلاحه، وما الذي عليك تركه.\n\nهذه صفحة مؤلمة، لكنها ليست الكتاب كله.',enTitle:'After losing something important',enBody:'Loss hurts because it can take not only what you had, but also the future you imagined. Do not rush yourself into being okay. Let grief have room, then separate what you lost from your worth. This is a painful page, not the whole book.'},
{id:'m08',cat:'reflection',title:'إلى من يكثر التفكير',body:'ليس كل سؤال يحتاج إلى جواب الليلة. وليس كل احتمال يستحق أن تعيشه في خيالك قبل أن يحدث.\n\nاكتب ما يقلقك، ثم اسأل نفسك: ما الشيء الذي أستطيع فعله الآن؟ وما الشيء الذي لا أملك التحكم فيه؟\n\nأعطِ الأول اهتمامك، واترك الثاني يأخذ حجمه الحقيقي. عقلك يستحق الراحة أيضاً.',enTitle:'To the one who overthinks',enBody:'Not every question needs an answer tonight, and not every possibility deserves to be lived in advance. Write down what worries you. Ask what you can act on now and what is outside your control. Give the first your attention, and let the second take its true size.'},
{id:'m09',cat:'faith',title:'حين تظن أن دعاءك تأخر',body:'لا تحوّل الانتظار إلى حكم على رحمة الله. نحن نرى لحظة الطلب، ولا نرى الصورة كاملة ولا كل ما قد يحمله الغد.\n\nاستمر في الدعاء، وخذ بالأسباب، ولا تجعل تعلقك بنتيجة واحدة يحجب عنك أبواب الخير الأخرى.\n\nقد لا تفهم التوقيت الآن، لكن يمكنك أن تبقى صادقاً في الرجاء.',enTitle:'When your prayer seems unanswered',enBody:'Do not turn waiting into a verdict on mercy. We see the moment we ask, not the whole picture or everything tomorrow may hold. Keep praying, take practical steps, and do not let one expected outcome hide every other door of goodness.'},
{id:'m10',cat:'relationships',title:'حين يصبح الصمت جواباً',body:'ليس عليك أن تطارد تفسيراً من شخص اختار ألا يشرح. يمكنك أن تطلب الوضوح مرة، وأن تعبّر عن أثر الغياب، ثم تحمي سلامك.\n\nالعلاقة الصحية لا تجعلك تخمّن مكانتك كل يوم. اختر الوضوح المتبادل، ولا تجعل انتظار رسالة يوقف حياتك.',enTitle:'When silence becomes an answer',enBody:'You do not have to chase an explanation from someone who chooses not to offer one. Ask for clarity, express how the absence affects you, then protect your peace. A healthy connection should not make you guess your place every day.'},
{id:'m11',cat:'life',title:'حين تتغير النسخة التي تعرفها من نفسك',body:'التغير لا يعني أنك خنت نفسك القديمة. ربما تعلمت، وربما تألمت، وربما اكتشفت أن ما كان يناسبك لم يعد يناسبك.\n\nاحتفظ بما كان جميلاً، وودّع ما انتهى دون أن تعاقب نفسك عليه. لك الحق أن تنمو وأن تعيد اختيار الطريق.' ,enTitle:'When you no longer recognize yourself',enBody:'Change does not mean you betrayed your former self. You may have learned, been hurt, or discovered that what once fit no longer does. Keep what was beautiful, release what has ended, and allow yourself to grow.'},
{id:'m12',cat:'ambition',title:'لا تجعل المقارنة تسرق رحلتك',body:'أنت لا تعرف كل ما وراء نجاح الآخرين، كما أنهم لا يعرفون كل ما وراء محاولاتك. المقارنة تعرض لك لقطة، ثم تطلب منك أن تحاكم بها حياة كاملة.\n\nاستلهم من الناس، لكن قِس تقدمك بما تعلمته وبما أصبحت قادراً على فعله مقارنة بنفسك بالأمس.',enTitle:'Do not let comparison steal your journey',enBody:'You do not know everything behind someone else’s success, just as they do not know everything behind your efforts. Comparison shows you a snapshot and asks you to judge an entire life. Take inspiration, but measure growth against your past self.'},
{id:'m13',cat:'study',title:'إلى الطالب الذي فقد شغفه',body:'ليس ضرورياً أن تحب كل يوم في طريقك حتى تكمله. أحياناً يكفي أن تتذكر لماذا بدأت، وأن تعيد ترتيب حملك بدلاً من أن تتركه كله.\n\nقسّم المطلوب، خذ استراحة حقيقية، واطلب المساعدة في الجزء الذي تعثر فيه. الشغف قد يعود بعد الحركة، لا قبلها.',enTitle:'To the student who lost motivation',enBody:'You do not have to love every day of the journey to continue it. Remember why you began, reorganize the load, break the work into pieces, rest properly, and ask for help where you are stuck. Motivation sometimes returns after action, not before it.'},
{id:'m14',cat:'healing',title:'حين لا تستطيع شرح ما بداخلك',body:'ليس عليك أن تجد الكلمات كلها الآن. يمكنك أن تقول لشخص تثق به: أنا لست بخير، ولا أعرف كيف أشرح، لكنني أحتاج أن تبقى قريباً.\n\nوإذا طال الثقل أو عطّل حياتك، فطلب دعم مختص ليس ضعفاً. لا يلزم أن تحمل كل شيء وحدك.',enTitle:'When you cannot explain what is inside',enBody:'You do not need all the words right now. You can tell someone you trust: I am not okay, and I do not know how to explain it, but I need you near. If the heaviness persists or disrupts your life, seeking professional support is a strength.'},
{id:'m15',cat:'reflection',title:'رسالة إلى قلب يستعجل الإجابات',body:'بعض الأشياء تتضح بالتجربة، وبعضها لا يصبح أخف إلا بعد أن نتوقف عن مقاومته طوال الوقت.\n\nلا تجعل حاجتك إلى اليقين تمنعك من عيش ما هو متاح اليوم. خذ قرارك بما تعرفه، وكن مستعداً لتعديله عندما تتعلم أكثر.',enTitle:'To a heart rushing for answers',enBody:'Some things become clear through experience; others grow lighter when we stop resisting them constantly. Do not let the need for certainty keep you from living what is available today. Decide with what you know, and stay open to learning.'},
{id:'m16',cat:'faith',title:'حين تخجل من كثرة عودتك',body:'العودة المتكررة ليست سبباً لليأس. لا تجعل الشيطان يحوّل ندمك إلى قنوط، ولا تجعل خطأك تعريفاً دائماً لنفسك.\n\nتب بصدق، أصلح ما تستطيع، وابتعد عن الأسباب التي تعيدك إلى الخطأ. واطلب من الله العون والثبات.',enTitle:'When you feel ashamed of returning again',enBody:'Returning again is not a reason to despair. Do not let regret become hopelessness or let one mistake define you forever. Repent sincerely, repair what you can, avoid what leads you back, and ask God for steadiness.'},
{id:'m17',cat:'relationships',title:'إلى من يعطي أكثر مما يحتمل',body:'العطاء الجميل لا يعني أن تلغي احتياجاتك. تستطيع أن تكون كريماً وأن تقول لا، وأن تحب دون أن تتحمل مسؤولية مشاعر الجميع.\n\nضع حدوداً لا تعاقب بها الآخرين، بل تحمي بها قدرتك على الاستمرار بمحبة واتزان.',enTitle:'To the one who gives beyond their limits',enBody:'Generosity does not require erasing your own needs. You can be kind and still say no. You can love without carrying responsibility for everyone’s feelings. Set boundaries that protect your ability to keep caring.'},
{id:'m18',cat:'failure',title:'حين تخاف تكرار الفشل',body:'الفشل السابق معلومة، لا نبوءة. افهم ما الذي لم ينجح، وغيّر ما يمكن تغييره، وابدأ بحجم مخاطرة تستطيع تحمله.\n\nالشجاعة ليست أن تضمن النتيجة؛ بل أن تتعلم دون أن تترك تجربة واحدة تحكم على كل المحاولات القادمة.',enTitle:'When you fear failing again',enBody:'A past failure is information, not a prophecy. Understand what did not work, change what you can, and begin with a manageable risk. Courage is not guaranteeing an outcome; it is learning without letting one experience judge every attempt ahead.'},
{id:'m19',cat:'life',title:'إلى من يحتاج أن يبدأ من جديد',body:'ليس عليك أن تمحو الماضي كي تبدأ. خذ منه ما علمك، واترك ما لم يعد يخدمك.\n\nابدأ من المكان الذي تقف فيه، وبالأدوات التي تملكها، لا من نسخة مثالية تتخيلها. البداية الجديدة لا تحتاج إعلاناً كبيراً؛ تحتاج قراراً يتكرر في الأيام العادية.',enTitle:'To the one who needs a fresh start',enBody:'You do not have to erase the past to begin again. Keep what it taught you and release what no longer serves you. Start where you stand, with what you have. A new beginning needs no grand announcement—only a decision repeated on ordinary days.'},
{id:'m20',cat:'ambition',title:'إلى من يعمل بصمت',body:'قد لا يرى أحد عدد المرات التي حاولت فيها، ولا الساعات التي قضيتها تتعلم وحدك. لا تجعل غياب التصفيق دليلاً على غياب التقدم.\n\nاستمر في بناء شيء حقيقي، وراجع طريقك بصدق. ليس كل عمل صامت سيُكافأ كما تتمنى، لكنه قد يبني فيك قدرة لا تُرى الآن.',enTitle:'To the one working quietly',enBody:'Others may not see how many times you tried or the hours you spent learning alone. Do not mistake the absence of applause for the absence of progress. Keep building something real and review your path honestly.'},
{id:'m21',cat:'study',title:'حين تبدو المهمة أكبر منك',body:'لا تنظر إلى الجبل كله وأنت تحاول صعود أول متر. حوّل المهمة إلى أجزاء، وحدد أول خطوة يمكن إنجازها خلال نصف ساعة.\n\nابدأ بمسودة ناقصة، بسؤال واحد، أو بترتيب المصادر. الوضوح كثيراً ما يأتي أثناء العمل.',enTitle:'When the task feels bigger than you',enBody:'Do not stare at the whole mountain while trying to climb the first meter. Break the task into pieces and choose one step you can complete in thirty minutes. Clarity often arrives while working.'},
{id:'m22',cat:'healing',title:'إلى من يلوم نفسه على كل شيء',body:'تحمل مسؤولية ما فعلت، لكن لا تحمل مسؤولية ما لم يكن بيدك. هناك فرق بين مراجعة النفس وجلدها.\n\nاسأل: ماذا أتعلم؟ ماذا أصلح؟ ثم توقف عن إعادة المحاكمة نفسها كل ليلة. أنت تحتاج إلى فرصة للتغيير، لا إلى عقوبة لا تنتهي.',enTitle:'To the one who blames themselves for everything',enBody:'Take responsibility for what you did, but not for what was never in your hands. Self-reflection is different from self-punishment. Ask what you can learn and repair, then stop retrying the same trial every night.'},
{id:'m23',cat:'reflection',title:'عن الأشياء التي لا نملكها',body:'جزء من السلام أن تعرف أين ينتهي سعيك وأين تبدأ مساحة لا تتحكم فيها. ابذل ما تستطيع، وكن أميناً في اختيارك، ثم اترك للنتائج وقتها.\n\nالتسليم ليس كسلاً؛ قد يكون اعترافاً صادقاً بحدود الإنسان.',enTitle:'About the things beyond our control',enBody:'Part of peace is knowing where your effort ends and where what you cannot control begins. Do what you can, choose honestly, then give outcomes their time. Acceptance is not laziness; it is an honest recognition of human limits.'},
{id:'m24',cat:'relationships',title:'إلى من يفتقد شخصاً',body:'الاشتياق لا يعني دائماً أن العودة هي القرار الصحيح. أحياناً نشتاق إلى وقت، أو شعور، أو نسخة قديمة من العلاقة.\n\nاعترف بما تفتقده دون أن تنسى لماذا تغيرت الأمور. يمكنك أن تحفظ الذكرى في مكانها، وأن تواصل حياتك في الوقت نفسه.',enTitle:'To the one missing someone',enBody:'Missing someone does not always mean returning is the right choice. Sometimes we miss a time, a feeling, or an earlier version of a relationship. Honor the memory without forgetting why things changed.'},
{id:'m25',cat:'faith',title:'حين تبحث عن السكينة',body:'اجعل لك وقتاً لا تطلب فيه من نفسك إنجازاً. وقتاً للصلاة والذكر والتأمل، أو للجلوس في هدوء بعيداً عن ضجيج الشاشات.\n\nالسكينة لا تأتي دائماً دفعة واحدة؛ أحياناً تنمو من عادات صغيرة تعيد قلبك إلى ما يؤمن به.',enTitle:'When you are searching for serenity',enBody:'Make room for time in which you demand no achievement from yourself: prayer, remembrance, reflection, or quiet away from screens. Serenity does not always arrive all at once; sometimes it grows from small habits.'},
{id:'m26',cat:'failure',title:'حين لا تسير الخطة كما أردت',body:'الخطة وسيلة وليست وعداً من الحياة. إذا تغيرت الظروف، راجع الطريق دون أن تعتبر كل تعديل هزيمة.\n\nاسأل نفسك ما الذي بقي مهماً، وما الذي يمكن تغييره، وما الذي يجب التخلي عنه. المرونة ليست تنازلاً عن الهدف؛ إنها طريقة أخرى للوصول إليه.',enTitle:'When the plan does not go your way',enBody:'A plan is a tool, not a promise from life. When circumstances change, review the route without calling every adjustment a defeat. Ask what still matters, what can change, and what must be released.'},
{id:'m27',cat:'life',title:'إلى من يشعر أنه وحيد وسط الجميع',body:'قد تكون محاطاً بالناس ومع ذلك تشعر أنك غير مرئي. لا تقلل من هذا الشعور ولا تفترض أن الآخرين يعرفون ما تمر به.\n\nابدأ بمحادثة صادقة مع شخص آمن، أو ابحث عن مساحة تنتمي إليها. القرب الحقيقي لا يقاس بعدد الوجوه حولك، بل بإمكانية أن تكون على طبيعتك.',enTitle:'To the one feeling alone in a crowd',enBody:'You can be surrounded by people and still feel unseen. Do not dismiss that feeling or assume others know what you are going through. Begin an honest conversation with someone safe, or seek a space where you belong.'},
{id:'m28',cat:'ambition',title:'حين تخاف أن تضيع السنوات',body:'الخوف من ضياع الوقت قد يستهلك الوقت نفسه. لا تحتاج إلى تعويض كل شيء دفعة واحدة.\n\nاختر اتجاهاً واحداً للأشهر القادمة، وحدد عادة صغيرة تخدمه. راجع تقدمك كل فترة، واسمح للطريق أن يتطور معك.',enTitle:'When you fear wasting the years',enBody:'Fear of wasting time can consume the time itself. You do not need to make up for everything at once. Choose one direction for the coming months and one small habit that supports it.'},
{id:'m29',cat:'study',title:'إلى من ينتظر أن يصبح مستعداً',body:'الاستعداد ليس شعوراً دائماً يسبق الفعل. أحياناً تبنيه التجربة، والسؤال، والمحاولة الأولى التي لا تبدو مثالية.\n\nجهّز الأساسيات، اطلب رأياً موثوقاً، ثم اختبر نفسك في خطوة صغيرة. لا تجعل التحضير يتحول إلى طريقة أنيقة لتأجيل البداية.',enTitle:'To the one waiting to feel ready',enBody:'Readiness is not always a feeling that comes before action. Sometimes experience, questions, and an imperfect first attempt build it. Prepare the essentials, seek sound advice, then test yourself with a small step.'},
{id:'m30',cat:'healing',title:'حين تحتاج إلى أن تسامح نفسك',body:'المسامحة لا تعني إنكار الخطأ أو إعفاء نفسك من إصلاحه. تعني أن تعترف بما حدث، وتتحمل مسؤوليته، ثم تسمح لنفسك بأن تتغير.\n\nلا يمكنك العودة لتبديل الأمس، لكن يمكنك أن تجعل ما تعلمته جزءاً من اختيارك اليوم.',enTitle:'When you need to forgive yourself',enBody:'Forgiving yourself does not mean denying a mistake or avoiding repair. It means acknowledging what happened, taking responsibility, and allowing yourself to change. You cannot rewrite yesterday, but you can let what you learned shape today.'},
{id:'m31',cat:'reflection',title:'رسالة لمن فقد دهشته',body:'حاول أن تلاحظ شيئاً صغيراً دون أن تطلب منه فائدة: ضوء الصباح، رائحة المطر، حديثاً لطيفاً، أو صفحة أعجبتك.\n\nليس مطلوباً أن تكون مبهوراً بالحياة طوال الوقت. يكفي أحياناً أن تترك نافذة صغيرة مفتوحة للدهشة.',enTitle:'To the one who has lost their wonder',enBody:'Notice one small thing without asking it to be useful: morning light, the smell of rain, a kind conversation, or a page you enjoyed. You do not have to be amazed by life all the time. Leave a small window open.'},
{id:'m32',cat:'relationships',title:'حين تحتاج إلى وضع حد',body:'الحدود ليست جداراً ضد المحبة؛ إنها توضيح لما تستطيع تقديمه وما لا تستطيع.\n\nقل ما تحتاجه بهدوء ووضوح، ولا تدخل في تبرير لا ينتهي. من حقك أن تحمي وقتك وكرامتك وطاقتك، كما أن على الآخرين احترام ذلك.',enTitle:'When you need to set a boundary',enBody:'Boundaries are not walls against love; they clarify what you can and cannot offer. State what you need calmly and clearly. You have the right to protect your time, dignity, and energy.'},
{id:'m33',cat:'faith',title:'إلى من يريد أن يثبت',body:'الثبات لا يعني ألا تضعف أبداً. يعني أن تعرف كيف تعود إلى ما ينفعك حين تضعف، وأن تختار الصحبة والعادات التي تعينك.\n\nابدأ بالقليل الدائم، واطلب العون، ولا تجعل التعثر سبباً لترك الطريق كله.',enTitle:'To the one who wants to stay steadfast',enBody:'Steadfastness does not mean never feeling weak. It means knowing how to return to what helps when you do, and choosing habits and company that support you. Begin with a small, consistent practice.'},
{id:'m34',cat:'failure',title:'إلى من يظن أن الفرصة انتهت',body:'قد تكون فرصة معينة انتهت، وهذا مؤلم ويستحق الاعتراف. لكن لا تجعل نهاية باب واحد دليلاً على أن كل الأبواب أغلقت.\n\nافهم ما حدث، وتعلم ما تستطيع، ثم ابحث عن المسار التالي بعين أكثر خبرة.',enTitle:'To the one who thinks the chance is gone',enBody:'A particular opportunity may have ended, and that deserves to be acknowledged. But one closed door is not proof that every door is closed. Understand what happened, learn what you can, and look for the next path.'},
{id:'m35',cat:'life',title:'حين لا تشبه حياتك ما تخيلته',body:'من الطبيعي أن تحزن على المسافة بين ما تمنيت وما حدث. لكن حياتك ليست فاشلة لأنها جاءت بشكل مختلف.\n\nأعد النظر في أحلامك دون أن تخون قيمك. ربما تحتاج إلى طريق آخر، أو تعريف أوسع للنجاح، أو وقت أطول مما توقعت.',enTitle:'When life looks different than you imagined',enBody:'It is natural to grieve the distance between what you hoped for and what happened. But your life is not a failure because it took a different shape. Revisit your dreams without betraying your values.'},
{id:'m36',cat:'ambition',title:'إلى من يريد أن يصنع أثراً',body:'الأثر لا يبدأ دائماً بمشروع كبير أو جمهور واسع. قد يبدأ بإتقان عمل صغير، أو مساعدة شخص، أو مشاركة معرفة نافعة.\n\nابنِ شيئاً يستحق أن يبقى، واهتم بمن يتأثر به، لا بعدد من يراه فقط.',enTitle:'To the one who wants to make a difference',enBody:'Impact does not always begin with a large project or a wide audience. It may begin with doing small work well, helping one person, or sharing useful knowledge. Build something worth keeping.'},
{id:'m37',cat:'study',title:'حين تتراكم عليك المهام',body:'اكتب كل ما يدور في رأسك على ورقة. ثم اختر ثلاث مهام فقط: واحدة عاجلة، واحدة مهمة، وواحدة صغيرة تمنحك بداية سهلة.\n\nلا تجعل قائمة المهام تتحول إلى قائمة اتهام. هي أداة لتنظيم انتباهك، لا لقياس قيمتك.',enTitle:'When tasks pile up',enBody:'Write everything on your mind. Then choose only three tasks: one urgent, one important, and one small enough to get you moving. A to-do list is a tool for attention, not a measure of your worth.'},
{id:'m38',cat:'healing',title:'إلى من يبتسم وهو مثقل',body:'ليس مطلوباً منك أن تشرح تعبك لكل أحد، لكن حاول ألا تبقى وحدك معه دائماً. اختر شخصاً أميناً، وقل شيئاً حقيقياً ولو كان بسيطاً.\n\nطلب المساندة لا ينتقص من قوتك؛ قد يكون أكثر قراراتك شجاعة.',enTitle:'To the one smiling while carrying too much',enBody:'You do not have to explain your pain to everyone, but try not to remain alone with it all the time. Choose someone trustworthy and say something true, even if it is simple. Asking for support can be an act of courage.'},
{id:'m39',cat:'reflection',title:'عن معنى أن تكون كافياً',body:'لن تكون الأفضل في كل شيء، ولن يرضى عنك الجميع، ولن تنجز كل ما تخطط له. هذه ليست أدلة على نقصك؛ إنها حدود الحياة البشرية.\n\nاسعَ للتحسن دون أن تجعل قبولك لنفسك مؤجلاً إلى يوم لا يأتي.',enTitle:'On being enough',enBody:'You will not be the best at everything, please everyone, or complete every plan. These are not proofs of inadequacy; they are human limits. Seek growth without postponing self-acceptance until a day that may never come.'},
{id:'m40',cat:'faith',title:'رسالة قبل أن تنام',body:'اترك ما لم تستطع إنجازه لهذه الليلة. استغفر، وادعُ بما في قلبك، واذكر نعمة صغيرة مرت عليك اليوم.\n\nليس عليك أن تحل حياتك كلها قبل النوم. غداً يوم جديد، وخطوة واحدة صادقة تكفي لتبدأ.',enTitle:'A letter before you sleep',enBody:'Leave what you could not finish for tonight. Seek forgiveness, pray with what is in your heart, and remember one small blessing from today. You do not have to solve your whole life before sleeping. Tomorrow is another day.'}
];

const dict={ar:{brand:'رسالة إليك',eyebrow:'مساحة صغيرة، ورسائل كثيرة',welcome:'في مكان ما بين هذه الأوراق، هناك رسالة كُتبت لك.',enter:'ادخل إلى عالم الرسائل',introFoot:'خذ وقتك. لا توجد طريقة صحيحة للبحث.',worldEyebrow:'اتبع فضولك',worldTitle:'رسائل تنتظر أن تجدها',random:'ربما هذه رسالتك ✦',hint:'المس أي ورقة لتكتشفها',bottomNote:'بعض الرسائل لا تظهر إلا عندما تقترب منها.',favorite:'أضف إلى المفضلة',unfavorite:'إزالة من المفضلة',share:'مشاركة',download:'تحميل صورة',signature:'إليك، أينما كنت.',savedTitle:'رسائلك المحفوظة',admin:'إدارة الموقع',read:'قُرئت',empty:'لا توجد رسائل محفوظة بعد.',all:'الكل',copied:'تم نسخ رابط الرسالة',soundOn:'الأصوات مفعّلة',soundOff:'الأصوات متوقفة'},en:{brand:'A Letter to You',eyebrow:'A quiet space, a thousand letters',welcome:'Somewhere among these papers, a letter was written for you.',enter:'Enter the world of letters',introFoot:'Take your time. There is no right way to search.',worldEyebrow:'Follow your curiosity',worldTitle:'Letters waiting to be found',random:'Perhaps this is your letter ✦',hint:'Drag or touch the papers to explore',bottomNote:'Some letters appear only when you come closer.',favorite:'Save to favorites',unfavorite:'Remove from favorites',share:'Share',download:'Download image',signature:'For you, wherever you are.',savedTitle:'Your saved letters',admin:'Admin',read:'Read',empty:'No saved letters yet.',all:'All',copied:'Letter link copied',soundOn:'Sounds on',soundOff:'Sounds off'}};
let lang=localStorage.getItem('resala-lang')||'ar', activeCategory='all', current=null, soundEnabled=localStorage.getItem('resala-sound')==='1', audioCtx=null;
const $=s=>document.querySelector(s);const t=k=>dict[lang][k]||k;const tr=m=>lang==='ar'?m.title:m.enTitle;const body=m=>lang==='ar'?m.body:m.enBody;const catName=c=>categories[c]?.[lang==='ar'?0:1]||c;
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('#langBtn').textContent=lang==='ar'?'EN':'عربي';renderFilters();renderPapers();updateSavedCount();}
function readSet(){return new Set(JSON.parse(localStorage.getItem('resala-read')||'[]'))}function favSet(){return new Set(JSON.parse(localStorage.getItem('resala-favs')||'[]'))}function saveSet(key,set){localStorage.setItem(key,JSON.stringify([...set]))}
function renderFilters(){const f=$('#filters');f.innerHTML='';[['all',t('all')],...Object.entries(categories).map(([k,v])=>[k,v[lang==='ar'?0:1]])].forEach(([k,label])=>{const b=document.createElement('button');b.className='filter'+(activeCategory===k?' active':'');b.textContent=label;b.onclick=()=>{activeCategory=k;renderFilters();renderPapers()};f.append(b)})}
function renderPapers(){const field=$('#paperField');field.innerHTML='';let list=messages.filter(m=>activeCategory==='all'||m.cat===activeCategory);const read=readSet();const w=field.clientWidth||innerWidth-30,h=field.clientHeight||520;list.forEach((m,i)=>{const el=document.createElement('button');el.className='paper'+(read.has(m.id)?' read':'');el.dataset.id=m.id;el.style.zIndex=String(2+(i%7));el.style.rotate=((i*17)%13-6)+'deg';el.innerHTML=`<span class="paper-type">${catName(m.cat)}</span><span class="paper-title"></span><span class="paper-read">${read.has(m.id)?t('read'):'✧'}</span>`;el.querySelector('.paper-title').textContent=tr(m);el.addEventListener('pointerdown',startDrag);el.addEventListener('click',e=>{if(!el.dataset.moved)openMessage(m.id)});field.append(el);});layoutPapers(field)}
function layoutPapers(field){const els=[...field.children];if(!els.length)return;const w=field.clientWidth||innerWidth-30,pw=els[0].offsetWidth||130,cols=Math.max(2,Math.floor((w-16)/(pw+18))),cw=(w-16)/cols,ch=Math.max(132,els[0].offsetHeight+30);els.forEach((el,i)=>{const col=i%cols,row=Math.floor(i/cols),jx=((i*37)%21)-10,jy=((i*53)%17)-8;el.style.left=Math.max(4,8+col*cw+(cw-pw)/2+jx)+'px';el.style.top=(16+row*ch+jy)+'px'});field.style.height=(Math.ceil(els.length/cols)*ch+34)+'px'}
let drag=null;function startDrag(e){if(e.pointerType==='touch'||(e.button!==undefined&&e.button!==0))return;const el=e.currentTarget;drag={el,x:e.clientX,y:e.clientY,left:parseFloat(el.style.left),top:parseFloat(el.style.top),pid:e.pointerId};el.setPointerCapture?.(e.pointerId);el.classList.add('dragging');el.dataset.moved='';}document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.el.dataset.moved='1';drag.el.style.left=Math.max(0,Math.min($('#paperField').clientWidth-110,drag.left+dx))+'px';drag.el.style.top=Math.max(0,Math.min($('#paperField').clientHeight-100,drag.top+dy))+'px'});document.addEventListener('pointerup',()=>{if(drag){drag.el.classList.remove('dragging');const el=drag.el;setTimeout(()=>delete el.dataset.moved,100);drag=null}});
function playTone(type='paper'){if(!soundEnabled)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=type==='open'?520:type==='close'?340:260;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.16);o.start();o.stop(audioCtx.currentTime+.17)}catch(e){}}
let typingTimer;function openMessage(id){const m=messages.find(x=>x.id===id);if(!m)return;current=m;playTone('open');{const r=readSet();r.add(id);saveSet('resala-read',r)}$('#letterCategory').textContent=catName(m.cat);$('#letterTitle').textContent=tr(m);$('#letterBody').textContent='';$('#reader').classList.remove('hidden');updateFavoriteButton();let text=body(m),i=0;clearInterval(typingTimer);typingTimer=setInterval(()=>{i+=lang==='ar'?3:4;$('#letterBody').textContent=text.slice(0,i);if(i>=text.length)clearInterval(typingTimer)},18);markRead(id)}
function closeMessage(){clearInterval(typingTimer);$('#reader').classList.add('hidden');playTone('close');current=null}
function markRead(id){const el=document.querySelector('.paper[data-id="'+id+'"]');if(!el)return;el.classList.add('read');const r=el.querySelector('.paper-read');if(r)r.textContent=t('read')}
function updateFavoriteButton(){if(!current)return;const yes=favSet().has(current.id);$('#favoriteBtn').classList.toggle('active',yes);$('#favoriteBtn').innerHTML=(yes?'♥':'♡')+' <span>'+t(yes?'unfavorite':'favorite')+'</span>'}
function updateSavedCount(){$('#savedCount').textContent=favSet().size}
function renderSaved(){const box=$('#savedList'),f=favSet();box.innerHTML='';if(!f.size){box.textContent=t('empty');return}messages.filter(m=>f.has(m.id)).forEach(m=>{const el=document.createElement('div');el.className='saved-item';el.innerHTML=`<strong></strong><small></small>`;el.querySelector('strong').textContent=tr(m);el.querySelector('small').textContent=catName(m.cat);el.onclick=()=>{closeSaved();openMessage(m.id)};box.append(el)})}
function closeSaved(){$('#savedPanel').classList.add('hidden')}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
$('#enterBtn').onclick=()=>{playTone();$('#intro').classList.add('hidden');$('#world').classList.remove('hidden');renderPapers();window.scrollTo(0,0)};$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('resala-lang',lang);applyLang();if(current)openMessage(current.id)};$('#closeReader').onclick=closeMessage;$('#reader').addEventListener('click',e=>{if(e.target.classList.contains('reader-backdrop'))closeMessage()});$('#favoriteBtn').onclick=()=>{if(!current)return;const f=favSet();f.has(current.id)?f.delete(current.id):f.add(current.id);saveSet('resala-favs',f);updateFavoriteButton();updateSavedCount();playTone()};$('#savedBtn').onclick=()=>{$('#savedPanel').classList.remove('hidden');renderSaved()};$('#closeSaved').onclick=closeSaved;$('#randomBtn').onclick=()=>{const list=messages.filter(m=>activeCategory==='all'||m.cat===activeCategory);if(list.length)openMessage(list[Math.floor(Math.random()*list.length)].id)};$('#soundBtn').onclick=()=>{soundEnabled=!soundEnabled;localStorage.setItem('resala-sound',soundEnabled?'1':'0');$('#soundBtn').style.opacity=soundEnabled?'1':'.5';toast(t(soundEnabled?'soundOn':'soundOff'))};$('#shareBtn').onclick=async()=>{if(!current)return;let url=location.href.split('#')[0]+'#'+current.id;try{if(window.top!==window&&top.location.origin===location.origin)url=top.location.href.split('#')[0]+'#resala-'+current.id}catch(_){}try{if(navigator.share)await navigator.share({title:tr(current),text:body(current).slice(0,120),url});else{await navigator.clipboard.writeText(url);toast(t('copied'))}}catch(e){}};
$('#downloadBtn').onclick=()=>{if(!current)return;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1080;canvas.height=1350;const grad=ctx.createLinearGradient(0,0,1080,1350);grad.addColorStop(0,'#f4e8d1');grad.addColorStop(1,'#e2d0b1');ctx.fillStyle=grad;ctx.fillRect(0,0,1080,1350);ctx.strokeStyle='#a58a654c';ctx.lineWidth=3;ctx.strokeRect(35,35,1010,1280);ctx.fillStyle='#9a815c';ctx.textAlign='center';ctx.font='30px serif';ctx.fillText('✧  رسالة إليك  ✧',540,130);ctx.fillStyle='#40343a';ctx.font='bold 54px serif';wrapText(ctx,tr(current),540,260,850,78);ctx.font='34px serif';ctx.textAlign='right';wrapText(ctx,body(current),930,440,820,68);ctx.textAlign='center';ctx.font='28px serif';ctx.fillStyle='#8b7657';ctx.fillText('إليك، أينما كنت.',540,1240);const a=document.createElement('a');a.download='resala-ileik.png';a.href=canvas.toDataURL('image/png');a.click()};function wrapText(ctx,text,x,y,maxWidth,lineHeight){const paragraphs=text.split('\n');for(const p of paragraphs){let line='';for(const word of p.split(' ')){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight}else line=test}if(line){ctx.fillText(line,x,y);y+=lineHeight}y+=12}return y}
$('#year').textContent=new Date().getFullYear();$('#soundBtn').style.opacity=soundEnabled?'1':'.5';applyLang();if(location.hash){const id=location.hash.slice(1);if(messages.some(m=>m.id===id)){$('#intro').classList.add('hidden');$('#world').classList.remove('hidden');renderPapers();setTimeout(()=>openMessage(id),300)}}window.addEventListener('resize',()=>{if(!$('#world').classList.contains('hidden'))renderPapers()});
